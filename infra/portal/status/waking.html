<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="30">
<title>Portal BLU a acordar</title>
<style>
  :root { --ink: #163b45; --soft: #4b6670; --sand: #f6f1e8; --line: #e2d9c9; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--sand); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 32rem; margin: 1rem; padding: 2rem; background: #fffdf9; border: 1px solid var(--line); border-radius: 10px; }
  h1 { font: 1.6rem Georgia, serif; margin: 0 0 .75rem; }
  p { margin: .5rem 0; }
  .muted { color: var(--soft); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>O portal está a acordar</h1>
  <p>O servidor do portal foi desligado e já está a ser ligado outra vez. Demora normalmente 3 a 5 minutos.</p>
  <p>Esta página tenta de novo sozinha a cada 30 segundos. Nada do seu trabalho guardado se perdeu.</p>
  <p class="muted">The proposals portal is waking up; this page retries every 30 seconds.</p>
</main>
</body>
</html>
