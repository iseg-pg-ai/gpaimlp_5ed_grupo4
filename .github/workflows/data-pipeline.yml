name: Data pipeline

on:
  push:
    paths:
      - "data/**"
      - "etl/**"
      - "portal/**"
      - "dmc-workspace/templates/**"
      - "dashboard/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "uv.lock"
      - "translations/requirements.txt"
      - "scripts/**"
      - ".github/workflows/data-pipeline.yml"
  pull_request:
    paths:
      - "data/**"
      - "etl/**"
      - "portal/**"
      - "dmc-workspace/templates/**"
      - "dashboard/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "uv.lock"
      - "translations/requirements.txt"
      - "scripts/**"
      - ".github/workflows/data-pipeline.yml"
  workflow_dispatch:

jobs:
  build-warehouse:
    runs-on: windows-latest
    steps:
      # O contexto runner não existe no env do job; os caminhos são definidos num passo.
      - name: Set CI paths
        shell: pwsh
        run: |
          "CI_DATA_DIR=$env:RUNNER_TEMP\blu-data" >> $env:GITHUB_ENV
          "CI_WAREHOUSE_DIR=$env:RUNNER_TEMP\blu-warehouse" >> $env:GITHUB_ENV
      # As fontes reais vivem no S3 e nunca são expostas ao CI de pull requests.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install uv==0.12.19
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m uv lock --check --offline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/export_requirements.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt
      - name: Create synthetic ETL sources
        run: python scripts/create_ci_etl_fixture.py --output $env:CI_DATA_DIR
      - name: Run ETL and validation gate
        run: python -m etl.pipeline --data-dir $env:CI_DATA_DIR --output-dir $env:CI_WAREHOUSE_DIR
      - name: Verify validation gate
        shell: pwsh
        run: |
          $report = Get-Content "$env:CI_WAREHOUSE_DIR\validation_report.json" -Raw | ConvertFrom-Json
          if ($report.status -ne 'passed') { throw "Validation status: $($report.status)" }
      - name: Run regression tests
        run: python -m unittest tests.test_local_source tests.test_structured_dataset tests.test_etl_pipeline tests.test_portal_catalog tests.test_portal_data tests.test_weather -v
      - name: Publish warehouse delivery
        uses: actions/upload-artifact@v4
        with:
          name: blu-warehouse-ci-smoke
          path: ${{ runner.temp }}/blu-warehouse/
          if-no-files-found: error
