# Verifica estrutura e Markdown para impedir referências locais quebradas na documentação.
name: Documentation

on:
  push:
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.yaml"
      - ".github/workflows/documentation.yml"
      - "scripts/check_project.py"
      - ".gitignore"
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.yaml"
      - ".github/workflows/documentation.yml"
      - "scripts/check_project.py"
      - ".gitignore"
  workflow_dispatch:

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project structure and local links
        run: python3 scripts/check_project.py
      - name: Validate Markdown
        run: npx --yes markdownlint-cli2@0.19.0
