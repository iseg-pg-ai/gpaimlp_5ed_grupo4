name: Portal

on:
  push:
    paths:
      - "dmc-workspace/**"
      - "portal/**"
      - "etl/**"
      - "scripts/create_ci_etl_fixture.py"
      - "scripts/verify_image_delivery.py"
      - "tests/test_image_delivery.py"
      - "requirements.txt"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile.curation"
      - ".dockerignore"
      - ".github/workflows/portal.yml"
  pull_request:
    paths:
      - "dmc-workspace/**"
      - "portal/**"
      - "etl/**"
      - "scripts/create_ci_etl_fixture.py"
      - "scripts/verify_image_delivery.py"
      - "tests/test_image_delivery.py"
      - "requirements.txt"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile.curation"
      - ".dockerignore"
      - ".github/workflows/portal.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Set CI paths
        run: |
          echo "CI_DATA_DIR=$RUNNER_TEMP/blu-data" >> "$GITHUB_ENV"
          echo "BLU_WAREHOUSE_DIR=$RUNNER_TEMP/blu-warehouse" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: dmc-workspace/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install portal dependencies
        working-directory: dmc-workspace
        run: npm ci
      - name: Prepare synthetic warehouse
        run: |
          python scripts/create_ci_etl_fixture.py --output "$CI_DATA_DIR"
          python -m etl.pipeline --data-dir "$CI_DATA_DIR" --output-dir "$BLU_WAREHOUSE_DIR"
          python scripts/check_warehouse_release.py --warehouse "$BLU_WAREHOUSE_DIR"
      - name: Validate portal
        working-directory: dmc-workspace
        run: npm run check
      - name: Build portal
        working-directory: dmc-workspace
        run: npm run build
      - name: Validate isolated catalogue lifecycle
        working-directory: dmc-workspace
        run: npm run test:catalog-etl

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test delivery verification
        run: python -B -m unittest tests.test_image_delivery -v
      - name: Build unified delivery without publishing
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.curation
          push: false
          platforms: linux/amd64
          sbom: true
          provenance: mode=min
          outputs: type=oci,dest=${{ runner.temp }}/blu-curation.oci.tar
          tags: blu-curation:${{ github.sha }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
      - name: Verify OCI integrity and evidence
        env:
          BUILD_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python scripts/verify_image_delivery.py \
            --archive "$RUNNER_TEMP/blu-curation.oci.tar" \
            --digest "$BUILD_DIGEST" --revision "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/blu-delivery-evidence"
      - name: Preserve delivery evidence without the image
        uses: actions/upload-artifact@v4
        with:
          name: blu-delivery-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/blu-delivery-evidence/
          if-no-files-found: error
          retention-days: 14
