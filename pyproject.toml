[project]
name = "gpaimlp_5ed_grupo4"
version = "0.1.0"
description = "BLU local ETL, dashboards and optional translation and SageMaker environments."
requires-python = ">=3.12,<3.14"
dependencies = [
    "openpyxl==3.1.5",
    "pypdf==6.19.0",
    "pandas==2.3.3",
    "plotly==6.5.2",
    "streamlit==1.55.0",
]

[dependency-groups]
dev = ["pytest==9.0.0", "complexipy>=5.5.0"]
translation = ["argostranslate==1.11.0", "ctranslate2>=4.0,<5"]
sagemaker = [
    "boto3>=1.41,<2",
    "sagemaker==2.254.1",
    "sagemaker-mlflow>=0.4,<1",
    "ipython>=9.16.1",
    "numpy==2.3.4",
    "scikit-learn==1.7.2",
    "joblib==1.5.2",
]
agent = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-aws>=0.2.0",
    "boto3>=1.35.0",
    "pydantic>=2.7.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false
default-groups = []
