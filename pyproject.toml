[project]
name = "blu-ai-system"
version = "0.1.0"
description = "BLU AI intelligent itinerary platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8",
  "pydantic-settings>=2.4", "httpx>=0.27", "PyJWT>=2.9",
  "boto3>=1.35", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "python-multipart>=0.0.12",
  "pandas>=2.2", "openpyxl>=3.1", "pypdf>=5.0", "tenacity>=9.0"
  , "google-api-python-client>=2.140", "google-auth>=2.34"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6", "locust>=2.31"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shared*", "services*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
lint.select = ["E", "F"]
lint.ignore = ["B008", "BLE001"]
